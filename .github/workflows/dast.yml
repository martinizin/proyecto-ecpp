name: DAST (OWASP ZAP)

# Dynamic scan against the live deployment. The baseline is passive (it does not
# attack the app), so running it against production is safe: it validates the real
# attack surface an outsider sees (TLS, security headers, HTTP->HTTPS redirects).
# The app is almost fully session-gated, so the baseline reaches the public
# surface (/health/, /usuarios/login/, static); an authenticated scan is future
# work.
on:
  workflow_dispatch:

env:
  TARGET_URL: https://escuelaecppp.duckdns.org

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # World-writable output dir: the ZAP container runs as a non-root user and
      # cannot write reports into the workspace otherwise.
      - name: Prepare ZAP output directory
        run: mkdir -p zap-out && chmod 777 zap-out

      # exit code ignored: a baseline returns non-zero on warnings, and the
      # report is the deliverable.
      - name: OWASP ZAP baseline scan
        run: |
          docker run -v "${{ github.workspace }}/zap-out:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ env.TARGET_URL }}" -r zap-report.html -w zap-report.md -a \
            || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-out/
          retention-days: 90
