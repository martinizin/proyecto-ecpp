name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ecppp_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_NAME: ecppp_test
      DATABASE_USER: test_user
      DATABASE_PASSWORD: test_pass
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DJANGO_SECRET_KEY: test-secret-key-ci-only
      DJANGO_SETTINGS_MODULE: config.settings.development
      # Dummy key para que el SDK de openai se instancie sin Missing credentials
      # en tests. Los tests que mockean el SDK no usan esta key.
      OPENAI_API_KEY: sk-test-dummy-key-not-used-for-real-calls

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt via `-r`.
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 .

      - name: Check formatting with black
        run: black --check .

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests with coverage
        run: coverage run -m pytest

      - name: Check coverage threshold
        run: coverage report --fail-under=70

  bandit:
    # SAST for our own code. Reports ALL severities as an artifact + step
    # summary for visibility, but only fails the job on HIGH severity
    # (MEDIUM/LOW are visible, non-blocking — see spec.md `bandit-static-scan`
    # and design.md ADR notes on this assumption).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt via `-r`.
        run: pip install -r requirements-dev.txt

      - name: Run Bandit (all severities, non-blocking report)
        # --exit-zero: this invocation never fails the job by itself; it only
        # produces the full-visibility SARIF report. The actual blocking gate
        # is the "Enforce HIGH-severity gate" step further below.
        run: |
          bandit -r apps config -f sarif -o bandit.sarif --exit-zero \
            --exclude "*/migrations/*,*/tests/*,*/venv/*,*/.venv/*"

      - name: Bandit step summary (all severities)
        if: always()
        run: |
          {
            echo "## Bandit SAST results (all severities)"
            echo '```'
            bandit -r apps config -f txt --exit-zero \
              --exclude "*/migrations/*,*/tests/*,*/venv/*,*/.venv/*"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bandit SARIF report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sarif
          path: bandit.sarif
          retention-days: 30

      - name: Enforce HIGH-severity gate
        # Only HIGH-severity findings block the PR/push. This is a separate
        # bandit invocation (no --exit-zero) filtered to --severity-level
        # high, so its exit code is 1 iff a HIGH finding exists (verified
        # locally: 0 with only LOW findings, 1 with a planted
        # `subprocess(..., shell=True)`).
        run: |
          bandit -r apps config --severity-level high \
            --exclude "*/migrations/*,*/tests/*,*/venv/*,*/.venv/*"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        # `analyze` builds the SARIF results and uploads them to
        # Security -> Code scanning for this commit SHA internally.
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
