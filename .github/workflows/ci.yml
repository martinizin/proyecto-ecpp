name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  COVERAGE_MIN: "70"
  BANDIT_TARGETS: "apps config"
  BANDIT_EXCLUDE: "*/migrations/*,*/tests/*,*/venv/*,*/.venv/*"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ecppp_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_NAME: ecppp_test
      DATABASE_USER: test_user
      DATABASE_PASSWORD: test_pass
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DJANGO_SECRET_KEY: test-secret-key-ci-only
      DJANGO_SETTINGS_MODULE: config.settings.development
      # Dummy key so the OpenAI SDK instantiates; mocked tests never call out.
      OPENAI_API_KEY: sk-test-dummy-key-not-used-for-real-calls
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Lint with flake8
        run: flake8 .

      - name: Check formatting with black
        run: black --check .

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests with coverage
        run: coverage run -m pytest

      - name: Check coverage threshold
        run: coverage report --fail-under=${{ env.COVERAGE_MIN }}

      - name: Generate coverage XML
        run: coverage xml

      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  bandit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Full-severity SARIF report for the Security tab; never fails the job.
      - name: Run Bandit (all severities, non-blocking report)
        run: bandit -r ${{ env.BANDIT_TARGETS }} -f sarif -o bandit.sarif --exit-zero --exclude "${{ env.BANDIT_EXCLUDE }}"

      - name: Bandit step summary (all severities)
        if: always()
        run: |
          {
            echo "## Bandit SAST results (all severities)"
            echo '```'
            bandit -r ${{ env.BANDIT_TARGETS }} -f txt --exit-zero --exclude "${{ env.BANDIT_EXCLUDE }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bandit SARIF report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sarif
          path: bandit.sarif
          retention-days: 30

      # Blocking gate: only HIGH-severity findings fail the build.
      - name: Enforce HIGH-severity gate
        run: bandit -r ${{ env.BANDIT_TARGETS }} --severity-level high --exclude "${{ env.BANDIT_EXCLUDE }}"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
