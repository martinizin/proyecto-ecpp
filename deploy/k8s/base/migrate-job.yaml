# Argo CD PreSync hook Job — runs `manage.py migrate` exactly once per sync,
# decoupled from pod boot (fixes the multi-replica migration race). A stable
# name + BeforeHookCreation delete policy guarantees Argo CD deletes the prior
# Job right before recreating it, so each sync produces exactly one fresh Job
# (spec `migration-runs-once-per-deploy`, design.md §5).
#
# This Job invokes `manage.py migrate` directly instead of relying on
# entrypoint.sh's RUN_MIGRATIONS_ON_BOOT gate, so it does not depend on the
# gate's default value.
#
# A PreSync hook runs BEFORE the normal sync phase that creates web-config, so
# it cannot use `envFrom: web-config` (that ConfigMap does not exist yet and the
# Job would fail with "configmap not found"). The non-secret DB settings it needs
# to run migrations are therefore inlined here; the sensitive ones come from the
# out-of-band web-secrets Secret, which already exists before any sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: web-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          image: ghcr.io/martinizin/proyecto-ecpp:develop
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            # Non-secret DB settings, inlined because web-config is not created
            # until after this PreSync hook. Kept in sync with base/configmap.yaml.
            - name: DJANGO_SETTINGS_MODULE
              value: "config.settings.production"
            - name: DATABASE_HOST
              value: "postgres-host"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: "ecppp"
            - name: DATABASE_USER
              value: "ecppp"
          envFrom:
            # DJANGO_SECRET_KEY and DATABASE_PASSWORD live here; the Secret is
            # created out-of-band and exists before any sync.
            - secretRef:
                name: web-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
