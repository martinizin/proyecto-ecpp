# Image-signature verification in AUDIT mode: reports violations without
# blocking admission. Apply this first to confirm the signed digest passes
# against a real pod, then switch to the Enforce variant. Only our own image is
# checked; the upstream nginx that serves media carries no signature of ours and
# must not be rejected, so imageReferences is scoped to ghcr.io/martinizin/*.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
spec:
  validationFailureAction: Audit
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-ghcr-signature
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["ecppp-prod", "ecppp-staging"]
      verifyImages:
        - imageReferences:
            - "ghcr.io/martinizin/proyecto-ecpp*"
          # Audit only reports; it must not mutate. mutateDigest stays false here
          # (Kyverno rejects the policy otherwise) and is true in the Enforce
          # variant, where pinning the verified digest is wanted.
          mutateDigest: false
          required: true
          attestors:
            - count: 1
              entries:
                # Keyless (Fulcio/Rekor) identity of the CD workflow that runs
                # `cosign sign`. Must match the OIDC cert Cosign obtained:
                #   subject  = the workflow file on refs/heads/develop
                #   issuer   = GitHub Actions OIDC provider
                - keyless:
                    subjectRegExp: "https://github\\.com/martinizin/proyecto-ecpp/\\.github/workflows/.+@refs/heads/develop"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: "https://rekor.sigstore.dev"
