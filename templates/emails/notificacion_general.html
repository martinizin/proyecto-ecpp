{% extends "emails/base_email.html" %}
{% block subject %}ECPP — {{ titulo }}{% endblock %}
{% block content %}
<h2 style="margin: 0 0 16px; color: #1f2937; font-size: 20px; font-weight: 600;">
    {{ titulo }}
</h2>
<p style="margin: 0 0 20px; color: #374151; font-size: 15px; line-height: 1.6;">
    {{ mensaje }}
</p>
{% if detalle %}
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="margin: 0 0 24px; background-color: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb;">
    {% for label, valor in detalle %}
    <tr>
        <td style="padding: 12px 20px;{% if not forloop.last %} border-bottom: 1px solid #e5e7eb;{% endif %}">
            <p style="margin: 0 0 4px; color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;">{{ label }}</p>
            <p style="margin: 0; color: #1f2937; font-size: 15px; font-weight: 500;">{{ valor }}</p>
        </td>
    </tr>
    {% endfor %}
</table>
{% endif %}
{% endblock %}
